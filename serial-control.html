<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水號管制表</title>
<script>(function(){var t=null,m=location.search.match(/[?&]theme=(dark|light)/);try{if(m){t=m[1];localStorage.setItem("pdf-tools-theme",t)}else t=localStorage.getItem("pdf-tools-theme")}catch(e){if(m)t=m[1]}document.documentElement.dataset.theme=t==="dark"?"dark":"light"})();</script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7; --panel:#fff; --ink:#1f2937; --muted:#6b7280; --line:#d1d5db; --line-strong:#9ca3af;
  --accent:#2563eb; --accent-ink:#fff;
  --done:#dcfce7; --done-ink:#166534;
  --reason:#e0e7ff; --reason-ink:#3730a3;
  --pending:#fef3c7; --pending-ink:#92400e;
  --head:#eef0f3; --danger:#b91c1c;
}
:root[data-theme="dark"]{
  color-scheme:dark;
    --bg:#111827; --panel:#1f2937; --ink:#e5e7eb; --muted:#9ca3af; --line:#374151; --line-strong:#6b7280;
    --accent:#60a5fa; --accent-ink:#0b1220;
    --done:#14532d; --done-ink:#bbf7d0;
    --reason:#312e81; --reason-ink:#c7d2fe;
    --pending:#78350f; --pending-ink:#fde68a;
    --head:#273244; --danger:#fca5a5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.home{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink);text-decoration:none;font-weight:600}
.home:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:6px 12px;border-radius:999px;font-size:13px}
.theme-btn svg{width:16px;height:16px}
.theme-btn .i-sun,.theme-btn .lbl-light{display:none}
:root[data-theme="dark"] .theme-btn .i-sun,:root[data-theme="dark"] .theme-btn .lbl-light{display:inline}
:root[data-theme="dark"] .theme-btn .i-moon,:root[data-theme="dark"] .theme-btn .lbl-dark{display:none}
h1{font-size:20px;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row + .row{margin-top:10px}
.spacer{flex:1}
label{color:var(--muted);font-size:13px}
button,.btn{font:inherit;padding:6px 12px;border:1px solid var(--line-strong);border-radius:7px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
input[type=number],input[type=text],select{font:inherit;padding:5px 8px;border:1px solid var(--line-strong);border-radius:7px;background:var(--panel);color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.monthbox{display:flex;align-items:center;gap:6px}
.monthbox input{width:70px;text-align:center}
.monthbox select{width:76px}
.big-title{font-size:18px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.75;margin-left:4px}

.stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.stat b{font-size:20px;margin-right:2px}
.stat span{color:var(--muted);font-size:12.5px}
.bar{flex:1;min-width:200px;height:10px;background:var(--head);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-done{background:#22c55e}.bar .b-reason{background:#818cf8}
.reasons-sum{color:var(--muted);font-size:12.5px;margin-top:6px}

.quick input[type=text]{width:260px}
.hint{color:var(--muted);font-size:12.5px}
.warn{color:var(--danger);font-weight:600}
.banner{background:var(--pending);color:var(--pending-ink);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:none}
.banner.show{display:block}

.print-title{display:none}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
table.blk{border-collapse:collapse;width:100%;background:var(--panel);table-layout:fixed;border:1px solid var(--line-strong)}
.blk th{background:var(--head);font-size:12px;font-weight:600;padding:3px 2px;border:1px solid var(--line);position:sticky;top:0;z-index:1;line-height:1.2}
.blk td{border:1px solid var(--line);height:26px;padding:0;text-align:center}
.blk col.c1{width:34%}.blk col.c2{width:20%}.blk col.c3{width:46%}
.blk td.num{font-variant-numeric:tabular-nums;font-weight:600}
.blk td.chk{cursor:pointer;user-select:none;font-weight:700}
.blk td.chk:hover{background:var(--head)}
.blk td.chk.on{background:var(--done);color:var(--done-ink)}
.blk input.rsn{width:100%;height:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:12.5px;padding:0 2px;color:inherit;border-radius:0}
.blk td.rs.on{background:var(--reason);color:var(--reason-ink)}
.blk td.num.pend{background:var(--pending);color:var(--pending-ink)}
.blk td.num.hl{outline:2px solid var(--accent);outline-offset:-2px}
.blk tr.beyond td.num{color:var(--muted);font-weight:400}

dialog{border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--ink);max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin-top:0}
dialog ul{padding-left:18px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw}
.toast.show{opacity:1}

@media print{
  @page{size:A4 landscape;margin:6mm}
  body{background:#fff;color:#000;font-size:8pt}
  .wrap{max-width:none;padding:0}
  .topbar,.panel,.banner,.toast,.noprint{display:none!important}
  .print-title{display:block;text-align:center;font-size:15pt;font-weight:700;margin:0 0 1.5mm}
  .blocks{display:flex;gap:0;flex-wrap:nowrap}
  table.blk{flex:1;border:1px solid #000;background:#fff}
  .blk th{position:static;background:#fff;font-size:6.5pt;padding:0;border-color:#000}
  .blk td{height:2.82mm;border-color:#000;font-size:7pt;line-height:1}
  .blk input.rsn{font-size:6pt}
  .blk td.chk.on,.blk td.rs.on,.blk td.num.pend{background:#fff!important;color:#000!important}
  .blk td.num.hl{outline:none}
  .blk tr.beyond td.num{color:#000}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="home" href="index.html" data-nav="index.html">← 工具箱首頁</a>
    <h1>流水號管制表</h1>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="切換深色或淺色主題" title="切換深色或淺色主題"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbl-dark">深色</span><span class="lbl-light">淺色</span></button>
  </div>

  <div class="banner" id="backupBanner"></div>

  <div class="panel noprint">
    <div class="row">
      <div class="monthbox">
        <button id="prevM" title="上一個月">‹</button>
        <label>民國</label><input type="number" id="yr" min="1" max="999">
        <label>年</label>
        <select id="mo"></select>
        <label>月</label>
        <button id="nextM" title="下一個月">›</button>
        <button id="todayM">本月</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <span class="big-title" id="titleText"></span>
      <span class="spacer"></span>
      <label>發號至 <input type="number" id="limit" min="1" max="600" style="width:76px" placeholder="自動"></label>
      <span class="hint" id="limitHint"></span>
    </div>
  </div>

  <div class="panel noprint">
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>已輸入</span></div>
      <div class="stat"><b id="sReason">0</b><span>未輸入（有原因）</span></div>
      <div class="stat"><b id="sPend">0</b><span>待處理</span></div>
      <div class="stat"><b id="sPct">0%</b><span>已處理比例</span></div>
      <div class="bar" title="綠：已輸入　紫：有原因　空白：待處理"><i class="b-done" id="bDone"></i><i class="b-reason" id="bReason"></i></div>
    </div>
    <div class="reasons-sum" id="reasonSum"></div>
  </div>

  <div class="panel noprint quick">
    <div class="row">
      <label>快速輸入編號</label>
      <input type="text" id="quick" placeholder="例：25　或　25-40　或　3,8,12-15" autocomplete="off">
      <button class="primary" id="qDone">標記已輸入 V</button>
      <button id="qClear">清除標記</button>
      <span class="hint">已有「未輸入原因」的編號會略過，不會被覆蓋。</span>
    </div>
    <div class="row">
      <label><input type="checkbox" id="showPend"> 標示待處理（橘色）</label>
      <button id="pendList">待處理清單</button>
      <span class="spacer"></span>
      <button id="btnPrint">列印 / 存成 PDF</button>
      <button id="btnXlsx">匯出 Excel</button>
      <button id="btnImport">匯入 Excel…</button>
      <button id="btnBackup">備份（JSON）</button>
      <button id="btnRestore">還原備份…</button>
      <button id="btnClear" class="danger">清空本月</button>
    </div>
    <div class="row hint" id="storageNote"></div>
  </div>

  <div class="print-title" id="printTitle"></div>
  <div class="blocks" id="blocks"></div>
</div>

<input type="file" id="fileXlsx" accept=".xlsx,.xls" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<datalist id="reasonList"></datalist>

<dialog id="dlg"><h3 id="dlgTitle"></h3><div id="dlgBody"></div>
  <form method="dialog" class="row" style="margin-top:12px;justify-content:flex-end"><button id="dlgOk" value="ok">關閉</button></form>
</dialog>
<div class="toast" id="toast"></div>

  for(let k=0;k<BLOCKS;k++){
    const t=document.createElement('table');t.className='blk';
    t.innerHTML='<colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup><thead><tr><th>移送書<br>編號</th><th>是否<br>輸入</th><th>未輸入<br>原因</th></tr></thead>';
    const tb=document.createElement('tbody');
    for(let i=0;i<PER_BLOCK;i++){
      const n=k*PER_BLOCK+i+1;
      const tr=document.createElement('tr');
      const a=document.createElement('td');a.className='num';a.textContent=n;
      const b=document.createElement('td');b.className='chk';b.dataset.n=n;b.tabIndex=0;b.setAttribute('role','checkbox');
      const c=document.createElement('td');c.className='rs';
      const inp=document.createElement('input');inp.className='rsn';inp.type='text';inp.setAttribute('list','reasonList');inp.dataset.n=n;inp.setAttribute('aria-label','編號 '+n+' 未輸入原因');
      c.appendChild(inp);
      tr.append(a,b,c);tb.appendChild(tr);
      numEl[n]=a;chkEl[n]=b;rsnEl[n]=inp;rowEl[n]=tr;
    }
    t.appendChild(tb);host.appendChild(t);
  }
}
function paintCell(n){
  const s=stateOf(n);
  const isV=s==='V', isR=s&&!isV;
  chkEl[n].textContent=isV?'V':'';
  chkEl[n].classList.toggle('on',isV);
  chkEl[n].setAttribute('aria-checked',isV);
  rsnEl[n].value=isR?s:'';
  rsnEl[n].parentNode.classList.toggle('on',!!isR);
}
function paintPending(){
  const d=curData(),lim=effLimit(d),show=$('showPend').checked;
  for(let n=1;n<=TOTAL;n++){
    const pend=!d.items[n]&&n<=lim;
    numEl[n].classList.toggle('pend',show&&pend);
    rowEl[n].classList.toggle('beyond',n>lim);
  }
}
function paintAll(){
  for(let n=1;n<=TOTAL;n++){paintCell(n);numEl[n].classList.remove('hl');}
  paintPending();renderStats();renderHeader();
}
function renderHeader(){
  const t=cur.y+'年'+cur.m+'月流水號管制表';
  $('titleText').textContent=t;$('printTitle').textContent=t;document.title=t;
  $('yr').value=cur.y;$('mo').value=cur.m;
  const d=curData();
  $('limit').value=d.limit||'';
  $('limitHint').textContent=d.limit?'（手動設定）':'（自動：目前最大已標記號 '+autoLimit(d.items)+'；超過此號的空白不算待處理）';
  renderChips();
}
function monthProgress(d){
  let done=0,rs=0;for(const k in d.items){d.items[k]==='V'?done++:rs++;}
  return {done,rs,total:effLimit(d)};
}
function renderChips(){
  const host=$('chips');host.innerHTML='';
  Object.keys(db.months).sort().reverse().forEach(k=>{
    const d=db.months[k];if(!Object.keys(d.items).length&&k!==key(cur.y,cur.m))return;
    const [y,m]=k.split('-').map(Number);
    const p=monthProgress(d);
    const b=document.createElement('button');b.className='chip'+(y===cur.y&&m===cur.m?' on':'');
    b.innerHTML=y+'/'+m+'<small>'+(p.done+p.rs)+'/'+p.total+'</small>';
    b.onclick=()=>go(y,m);host.appendChild(b);
  });
}
function renderStats(){
  const d=curData(),lim=effLimit(d);
  let done=0,rs=0;const rc={};
  for(const k in d.items){const v=d.items[k];if(v==='V')done++;else{rs++;rc[v]=(rc[v]||0)+1;}}
  const pend=Math.max(0,lim-done-rs+countBeyond(d,lim));
  $('sDone').textContent=done;$('sReason').textContent=rs;$('sPend').textContent=pend;
  const base=Math.max(lim,done+rs)||1;
  $('sPct').textContent=lim?Math.round((done+rs)/base*100)+'%':'—';
  $('bDone').style.width=(done/base*100)+'%';$('bReason').style.width=(rs/base*100)+'%';
  const parts=Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v);
  $('reasonSum').textContent=parts.length?'原因分類：'+parts.join('　｜　'):'';
}
function countBeyond(d,lim){let c=0;for(const k in d.items){if(+k>lim)c++;}return c;}
function renderReasonList(){
  $('reasonList').innerHTML=db.reasons.map(r=>'<option value="'+r.replace(/"/g,'&quot;')+'">').join('');
}
function renderBanner(){
  const el=$('backupBanner');
  const hasData=Object.values(db.months).some(m=>Object.keys(m.items).length);
  const days=db.lastBackup?Math.floor((Date.now()-db.lastBackup)/864e5):null;
  const changed=db.lastChange&&(!db.lastBackup||db.lastChange>db.lastBackup);
  if(hasData&&changed&&(days===null||days>=7)){
    el.textContent=days===null?'提醒：還沒有備份過。資料只存在這個瀏覽器裡，請按「備份（JSON）」存一份。':'提醒：距離上次備份已 '+days+' 天，請按「備份（JSON）」再存一份。';
    el.classList.add('show');
  }else el.classList.remove('show');
}
function renderNotes(){
  const bk=db.lastBackup?'上次備份：'+new Date(db.lastBackup).toLocaleString('zh-TW'):'尚未備份';
  $('storageNote').innerHTML='資料自動存在這個瀏覽器（localStorage），改完即存。'+(memoryOnly?' <span class="warn">目前無法寫入瀏覽器儲存空間（可能是無痕模式），關閉分頁後資料會消失，請務必備份。</span>':'')+' '+bk+'。換電腦／換瀏覽器／清除瀏覽資料前請先備份。';
}

/* ---------- 操作 ---------- */
function go(y,m){
  if(m<1){m=12;y--;}if(m>12){m=1;y++;}
  if(y<1)return;
  cur={y,m};curData();paintAll();save();
  try{localStorage.setItem(KEY+'.last',key(y,m));}catch(e){}
}
function setState(n,val){
  const d=curData();
  if(val)d.items[n]=val;else delete d.items[n];
  if(val&&val!=='V'&&!db.reasons.includes(val)){db.reasons.push(val);renderReasonList();}
  paintCell(n);paintPending();renderStats();renderChips();
  $('limitHint').textContent=d.limit?'（手動設定）':'（自動：目前最大已標記號 '+autoLimit(d.items)+'；超過此號的空白不算待處理）';
  save();
}
$('blocks').addEventListener('click',e=>{
  const td=e.target.closest('td.chk');if(!td)return;
  const n=+td.dataset.n;setState(n,stateOf(n)==='V'?'':'V');
});
$('blocks').addEventListener('keydown',e=>{
  const td=e.target.closest&&e.target.closest('td.chk');
  if(td&&(e.key===' '||e.key==='Enter')){e.preventDefault();const n=+td.dataset.n;setState(n,stateOf(n)==='V'?'':'V');}
});
$('blocks').addEventListener('change',e=>{
  const inp=e.target.closest('input.rsn');if(!inp)return;
  const n=+inp.dataset.n;let v=inp.value.trim();
  if(v.toUpperCase()==='V')v='V';
  setState(n,v);
});

function parseNums(text){
  const out=new Set(),bad=[];
  text.split(/[\s,，、;；]+/).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^(\d+)(?:[-~－—–](\d+))?$/);
    if(!m){bad.push(tok);return;}
    let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];
    if(a<1||b>TOTAL){bad.push(tok);return;}
    for(let i=a;i<=b;i++)out.add(i);
  });
  return {nums:[...out],bad};
}
function quick(mark){
  const {nums,bad}=parseNums($('quick').value);
  if(bad.length){toast('無法辨識：'+bad.join('、')+'（編號需介於 1–'+TOTAL+'）');return;}
  if(!nums.length){toast('請先輸入編號');return;}
  const d=curData();let ok=0,skip=0;
  nums.forEach(n=>{
    const s=d.items[n];
    if(s&&s!=='V'){skip++;return;}
    if(mark){d.items[n]='V';}else{delete d.items[n];}
    ok++;paintCell(n);numEl[n].classList.add('hl');
  });
  paintPending();renderStats();renderChips();renderHeader();save();
  toast((mark?'已標記 ':'已清除 ')+ok+' 筆'+(skip?'，略過 '+skip+' 筆（有原因）':''));
  if(nums.length)numEl[nums[0]].scrollIntoView({block:'center',behavior:'smooth'});
  $('quick').select();
}
$('qDone').onclick=()=>quick(true);
$('qClear').onclick=()=>quick(false);
$('quick').addEventListener('keydown',e=>{if(e.key==='Enter')quick(true);});

$('limit').addEventListener('change',()=>{
  const v=parseInt($('limit').value,10);
  curData().limit=(v>=1&&v<=TOTAL)?v:null;
  paintPending();renderStats();renderHeader();save();
});
$('showPend').addEventListener('change',()=>{db.showPend=$('showPend').checked;paintPending();save();});
$('pendList').onclick=()=>{
  const d=curData(),lim=effLimit(d),list=[];
  for(let n=1;n<=lim;n++)if(!d.items[n])list.push(n);
  $('dlgTitle').textContent='待處理（共 '+list.length+' 筆）';
  $('dlgBody').innerHTML=list.length?'<div style="line-height:1.9;word-break:break-all">'+list.join('、')+'</div><p class="hint">範圍：1 – '+lim+'（沒有 V 也沒有原因）</p>':'<p>沒有待處理的編號 🎉</p>';
  $('dlg').showModal();
};
$('btnClear').onclick=()=>{
  const d=curData();
  if(!Object.keys(d.items).length){toast('本月沒有資料');return;}
  if(confirm('確定要清空 '+cur.y+'年'+cur.m+'月 的所有標記嗎？（建議先備份）')){d.items={};d.limit=null;paintAll();save();}
};
$('btnPrint').onclick=()=>window.print();

/* 月份選擇 */
(function(){
  const s=$('mo');for(let i=1;i<=12;i++){const o=document.createElement('option');o.value=i;o.textContent=i;s.appendChild(o);}
  $('prevM').onclick=()=>go(cur.y,cur.m-1);
  $('nextM').onclick=()=>go(cur.y,cur.m+1);
  $('todayM').onclick=()=>go(now.getFullYear()-1911,now.getMonth()+1);
  $('yr').onchange=()=>go(+$('yr').value||cur.y,cur.m);
  s.onchange=()=>go(cur.y,+s.value);
})();

/* ---------- 備份 / 還原（JSON） ---------- */
function download(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());};
$('btnBackup').onclick=()=>{
  const out={app:'serial-control',version:1,exported:new Date().toISOString(),months:db.months,reasons:db.reasons};
  download('流水號管制表備份_'+stamp()+'.json',new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  db.lastBackup=Date.now();save();renderNotes();toast('已下載備份檔');
};
$('btnRestore').onclick=()=>$('fileJson').click();
$('fileJson').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='serial-control'||!d.months)throw new Error('格式不符');
    const ks=Object.keys(d.months),over=ks.filter(k=>db.months[k]&&Object.keys(db.months[k].items).length);
    if(over.length&&!confirm('備份檔中的 '+over.join('、')+' 會覆蓋目前同月份的資料，要繼續嗎？'))return;
    ks.forEach(k=>{db.months[k]={items:d.months[k].items||{},limit:d.months[k].limit||null};});
    (d.reasons||[]).forEach(r=>{if(!db.reasons.includes(r))db.reasons.push(r);});
    renderReasonList();paintAll();save();toast('已還原 '+ks.length+' 個月份');
  }catch(err){toast('還原失敗：'+err.message);}
};

/* ---------- Excel 匯入 / 匯出（SheetJS，需要時才載入） ---------- */
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('無法載入 Excel 元件（需要網路）。可改用 JSON 備份。'));
    document.head.appendChild(s);
  });
}
function parseSheet(ws){
  const get=(r,c)=>{const cell=ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];return cell&&cell.v!=null?String(cell.v).trim():'';};
  const title=get(1,1),items={};
  for(let k=0;k<BLOCKS;k++)for(let i=0;i<PER_BLOCK;i++){
    const row=3+i,n=k*PER_BLOCK+i+1;
    const v=get(row,2+3*k),r=get(row,3+3*k).replace(/\s+/g,'');
    if(v&&/^[vV✓✔]$/.test(v))items[n]='V';   // 有 V 以 V 為準
    else if(r)items[n]=r;                      // 有原因：未輸入
  }
  const m=title.match(/(\d+)\s*年\s*(\d+)\s*月/);
  return {y:m?+m[1]:null,m:m?+m[2]:null,items};
}
$('btnImport').onclick=()=>$('fileXlsx').click();
$('fileXlsx').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  try{await loadXLSX();}catch(err){toast(err.message);return;}
  const log=[];
  for(const f of files){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const p=parseSheet(wb.Sheets[wb.SheetNames[0]]);
      if(!p.y){log.push('✗ '+f.name+'：標題找不到「○年○月」，略過');continue;}
      const ex=getMonth(p.y,p.m,false);
      if(ex&&Object.keys(ex.items).length&&!confirm(p.y+'年'+p.m+'月 已有資料，要用 '+f.name+' 覆蓋嗎？')){log.push('－ '+f.name+'：已略過');continue;}
      db.months[key(p.y,p.m)]={items:p.items,limit:null};
      Object.values(p.items).forEach(v=>{if(v!=='V'&&!db.reasons.includes(v))db.reasons.push(v);});
      const vs=Object.values(p.items),dn=vs.filter(v=>v==='V').length;
      log.push('✓ '+p.y+'年'+p.m+'月：已輸入 '+dn+'、有原因 '+(vs.length-dn));
    }catch(err){log.push('✗ '+f.name+'：'+err.message);}
  }
  renderReasonList();paintAll();save();
  $('dlgTitle').textContent='匯入結果';$('dlgBody').innerHTML='<ul>'+log.map(x=>'<li>'+x.replace(/</g,'&lt;')+'</li>').join('')+'</ul>';$('dlg').showModal();
};
$('btnXlsx').onclick=async()=>{
  try{await loadXLSX();}catch(err){toast(err.message);return;}
  const d=curData(),title=cur.y+'年'+cur.m+'月流水號管制表';
  const aoa=[[title]];
  const hdr=[];for(let k=0;k<BLOCKS;k++)hdr.push('移送書編號','是否輸入','未輸入原因');aoa.push(hdr);
  for(let i=0;i<PER_BLOCK;i++){
    const row=[];
    for(let k=0;k<BLOCKS;k++){const n=k*PER_BLOCK+i+1,s=d.items[n]||'';row.push(n,s==='V'?'V':'',s&&s!=='V'?s:'');}
    aoa.push(row);
  }
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:BLOCKS*3-1}}];
  ws['!cols']=hdr.map((_,i)=>({wch:i%3===2?11:8}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'工作表1');
  XLSX.writeFile(wb,cur.y+'_'+cur.m+'_流水號管制表.xlsx');
};

/* ---------- 其他 ---------- */
let tt;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}

load();
buildBlocks();renderReasonList();
$('showPend').checked=!!db.showPend;
try{const last=localStorage.getItem(KEY+'.last');
  // 預設開在「本月」；若本月尚無資料但上次停留的月份有資料，開上次停留的月份
  const k=key(cur.y,cur.m);
  if(last&&last!==k&&!(db.months[k]&&Object.keys(db.months[k].items).length)&&db.months[last]){const [y,m]=last.split('-').map(Number);cur={y,m};}
}catch(e){}
curData();paintAll();renderNotes();renderBanner();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
window.__sc={db:()=>db,parseSheet,go,setState};
})();
</script>
<script>
(function () {
  function cur() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
  function sync() { var t = cur(); document.querySelectorAll("a[data-nav]").forEach(function (a) { a.href = a.getAttribute("data-nav") + "?theme=" + t; }); }
  var b = document.getElementById("themeBtn");
  if (b) b.addEventListener("click", function () {
    var n = cur() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n;
    try { localStorage.setItem("pdf-tools-theme", n); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
